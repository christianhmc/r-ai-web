  <script>
    // La clave de acceso del Analista es el número de transacción de Wompi.
    // Al volver del pago llega como ?id= en la URL; se guarda en el navegador
    // del cliente por 12 MESES (la vigencia real del paquete, a diferencia del
    // Monitor cuyo comprobante vale 24 h) y se le pasa al iframe para que la
    // app lo deje entrar sin escribir nada. Mismo patrón de monitor.html.
    (function () {
      var CLAVE = "rai_analista_clave";
      var VENTANA_MS = 365 * 24 * 60 * 60 * 1000;
      var APP = "https://chatbot---actas-sempb-invima-oj48ju5zqoxzy7dfdvntuc.streamlit.app/?embed=true";

      // localStorage lanza excepción en navegación privada de algunos
      // navegadores. Si falla, la página sigue funcionando igual: se pierde
      // el recordatorio, no el acceso (el cliente teclea su clave en la app).
      function guardar(id) {
        try {
          localStorage.setItem(CLAVE, JSON.stringify({ id: id, t: Date.now() }));
        } catch (e) {}
      }
      function recuperar() {
        try {
          var crudo = localStorage.getItem(CLAVE);
          if (!crudo) return null;
          var g = JSON.parse(crudo);
          if (!g || !g.id || !g.t) return null;
          if (Date.now() - g.t > VENTANA_MS) {   // venció la vigencia del
            localStorage.removeItem(CLAVE);      // paquete: se limpia solo
            return null;
          }
          return g.id;
        } catch (e) { return null; }
      }

      var id = new URLSearchParams(location.search).get("id");
      if (id) {
        guardar(id);          // la de la URL siempre manda: una compra nueva
      } else {                // en el mismo equipo reemplaza a la anterior
        id = recuperar();
      }
      if (!id) return;

      document.getElementById("appframe").src = APP + "&id=" + encodeURIComponent(id);

      var barra = document.getElementById("clave-barra");
      document.getElementById("num-clave").textContent = id;
      barra.hidden = false;

      var boton = document.getElementById("copiar");
      boton.addEventListener("click", function () {
        var listo = function () {
          boton.textContent = "Copiada";
          setTimeout(function () { boton.textContent = "Copiar"; }, 2000);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(id).then(listo, function () {});
        } else {
          var s = window.getSelection(), r = document.createRange();
          r.selectNodeContents(document.getElementById("num-clave"));
          s.removeAllRanges(); s.addRange(r);
        }
      });
    })();
  </script>
