<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor Decreto de Transparencia — R-AI</title>
<meta name="description" content="Monitor del Decreto de Transparencia del INVIMA: genere su reporte de sometimientos por rango de fechas.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root{
    --paper:#f5f7fa;
    --card:#ffffff;
    --ink:#1c2b40;
    --muted:#5a6b80;
    --line:#dfe5ec;
    --accent:#1257c4;
    --accent2:#2e7ad6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#10151d;
      --card:#182028;
      --ink:#e7edf4;
      --muted:#93a3b6;
      --line:#273140;
      --accent:#5da2f0;
      --accent2:#7dbcff;
    }
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Avenir Next","Helvetica Neue","Segoe UI",sans-serif;
    margin:0;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  nav{
    display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
    padding:.7rem 1.4rem;
    border-bottom:1px solid var(--line);
    background:var(--card);
  }
  .brand{display:flex;align-items:center;gap:.55rem;margin-right:auto;text-decoration:none}
  .brand .bname{
    font-family:Futura,"Century Gothic","Avenir Next",sans-serif;
    font-weight:700;font-size:1.2rem;letter-spacing:.06em;color:var(--ink);
  }
  .btitle{color:var(--muted);font-size:.92rem}
  nav a.link{color:var(--muted);text-decoration:none;font-size:.9rem}
  nav a.link:hover{color:var(--accent)}

  .frame-holder{flex:1;display:flex;min-height:0}
  iframe{
    flex:1;width:100%;border:0;
    background:var(--paper);
  }

  /* Franja del comprobante: aparece solo cuando hay una compra en curso */
  #comprobante{
    display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;
    padding:.6rem 1.4rem;
    background:#eaf1fa;border-bottom:1px solid #cfdff2;
    color:#3c4c60;font-size:.86rem;line-height:1.5;
  }
  #comprobante[hidden]{display:none}
  @media (prefers-color-scheme: dark){
    #comprobante{background:#152a44;border-bottom-color:#24405f;color:#9aabbf}
  }
  #comprobante .etq{font-weight:600;color:var(--ink)}
  #comprobante code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:.15rem .45rem;font-size:.85rem;color:var(--ink);
  }
  #comprobante .pista{color:var(--muted)}
  #copiar{
    font:inherit;font-size:.8rem;font-weight:600;
    background:var(--accent);color:#fff;border:0;border-radius:6px;
    padding:.28rem .7rem;cursor:pointer;
  }
  #copiar:hover{background:var(--accent2)}
  #copiar:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

  @media (max-width:640px){
    .btitle{display:none}
  }
</style>
</head>
<body>

  <nav>
    <a class="brand" href="index.html">
      <svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true">
        <g stroke="#2e7ad6" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M32 32 L32 20 L26 14"/><path d="M32 32 L44 32 L50 26"/><path d="M32 32 L32 44 L38 50"/><path d="M32 32 L20 32 L14 38"/>
        </g>
        <g fill="#2e7ad6"><circle cx="26" cy="14" r="3.2"/><circle cx="50" cy="26" r="3.2"/><circle cx="38" cy="50" r="3.2"/><circle cx="14" cy="38" r="3.2"/></g>
        <circle cx="32" cy="32" r="4.6" fill="#1257c4"/>
      </svg>
      <span class="bname">R-AI</span>
    </a>
    <span class="btitle">Monitor Decreto de Transparencia</span>
    <a class="link" href="index.html">← Volver al inicio</a>
    <a class="link" href="https://monitor-rai-cutcvh5zmvuddmzbp5nkfc.streamlit.app/" target="_blank" rel="noopener">Pantalla completa ↗</a>
  </nav>

  <div id="comprobante" hidden>
    <span class="etq">🧾 Tu comprobante de pago:</span>
    <code id="num-comprobante"></code>
    <button id="copiar" type="button">Copiar</button>
    <span class="pista">Guárdalo: con él puedes volver a descargar tu reporte durante 24 horas.</span>
  </div>

  <div class="frame-holder">
    <iframe id="appframe"
      src="https://monitor-rai-cutcvh5zmvuddmzbp5nkfc.streamlit.app/?embed=true"
      title="Monitor Decreto de Transparencia — R-AI"
      allow="clipboard-write"
      loading="eager"></iframe>
  </div>

  <script>
    // El número de transacción de Wompi es la llave del reporte que el cliente
    // acaba de pagar, y hasta ahora vivía SOLO en la barra de direcciones: si
    // recargaba, cerraba la pestaña, o la app tardaba en despertar y él insistía,
    // lo perdía junto con su compra. Ahora se guarda en su propio navegador
    // durante 24 h — la misma ventana de re-descarga que aplica la app— y se
    // muestra en pantalla para que pueda anotarlo.
    (function () {
      var CLAVE = "rai_monitor_comprobante";
      var VENTANA_MS = 24 * 60 * 60 * 1000;
      var APP = "https://monitor-rai-cutcvh5zmvuddmzbp5nkfc.streamlit.app/?embed=true";

      // localStorage lanza excepción en navegación privada de algunos
      // navegadores. Si falla, la página sigue funcionando igual que antes:
      // se pierde el respaldo, no el flujo.
      function guardar(id) {
        try {
          localStorage.setItem(CLAVE, JSON.stringify({ id: id, t: Date.now() }));
        } catch (e) {}
      }
      function recuperar() {
        try {
          var crudo = localStorage.getItem(CLAVE);
          if (!crudo) return null;
          var g = JSON.parse(crudo);
          if (!g || !g.id || !g.t) return null;
          if (Date.now() - g.t > VENTANA_MS) {   // venció: se limpia solo, así
            localStorage.removeItem(CLAVE);      // no se intenta entrar con un
            return null;                         // comprobante ya expirado
          }
          return g.id;
        } catch (e) { return null; }
      }

      var id = new URLSearchParams(location.search).get("id");
      if (id) {
        guardar(id);          // el de la URL siempre manda: si el mismo equipo
      } else {                // hace una compra nueva, reemplaza a la anterior
        id = recuperar();
      }
      if (!id) return;

      document.getElementById("appframe").src = APP + "&id=" + encodeURIComponent(id);

      var barra = document.getElementById("comprobante");
      document.getElementById("num-comprobante").textContent = id;
      barra.hidden = false;

      var boton = document.getElementById("copiar");
      boton.addEventListener("click", function () {
        var listo = function () {
          boton.textContent = "Copiado";
          setTimeout(function () { boton.textContent = "Copiar"; }, 2000);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(id).then(listo, function () {});
        } else {
          var s = window.getSelection(), r = document.createRange();
          r.selectNodeContents(document.getElementById("num-comprobante"));
          s.removeAllRanges(); s.addRange(r);
        }
      });
    })();
  </script>

</body>
</html>
